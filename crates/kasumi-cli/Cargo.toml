[package]
name = "kasumi-cli"
description = "kasumi: live window, export, bench, explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kasumi"
path = "src/main.rs"

[dependencies]
kasumi-lang = { path = "../kasumi-lang" }
kasumi-gpu = { path = "../kasumi-gpu" }
kasumi-explore = { path = "../kasumi-explore" }
anyhow = "1"
minifb = "0.27"
font8x8 = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
