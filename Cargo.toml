[workspace]
resolver = "2"
members = [
    "crates/kasumi-lang",
    "crates/kasumi-gpu",
    "crates/kasumi-explore",
    "crates/kasumi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
