[package]
name = "kasumi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
font8x8 = "0.3"
libloading = "0.8"
minifb = "0.27"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
