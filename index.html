<figure><video src="01.mp4" poster="01.jpg" muted loop playsinline preload="none"></video><figcaption><a href="01.jpg">01</a><details><summary>formula</summary><pre># clifford: a strange attractor. px / py are the previous point, so every
# gpu thread walks its own chaotic orbit; the params drift slowly with time
@points 40m
@iters 200
@palette ember
@zoom 0.4
@gamma 2.6
let a = -1.7 + 0.12 * sin(t * 0.21)
let e = 1.8 + 0.1 * cos(t * 0.17)
let c = -1.312
let d = -1.2 + 0.08 * sin(t * 0.13)
x = sin(a * py) + c * cos(a * px)
y = sin(e * px) + d * cos(e * py)
h = smoothstep(0, 1.6, mag(x + -0.2306 * sin(1.084 * c + -0.5222 * t) - px, y - py))
</pre></details></figcaption></figure>

<figure><video src="10.mp4" poster="10.jpg" muted loop playsinline preload="none"></video><figcaption><a href="10.jpg">10</a><details><summary>formula</summary><pre># knot: a torus knot made of rings, with depth of field from z
@points 30m
@palette ink
@dof 0.06
@focus 0
param p = 2.924
param q = 7
let s = floor(u * 1500) / 1500
let v = fract(u * 1500) * tau
let a = s * tau + t * 0.05
let rr = 0.55 + 0.1308 * cos(4.639 * a + -0.1518 * t) + 0.22 * cos(q * a)
let cx = rr * sin(p * a)
let cy = rr * sin(p * a)
let cz = 0.22 * sin(q * a)
let ring = 0.05 + 0.02 * (t * 0.05)
let x3 = cx + ring * (cos(v) + 0.2665 * sin(3.55 * ring + -0.5359 * t)) * cos(p * a)
let y3 = cy + ring * cos(v) * sin(p * a)
let z3 = cz + ring * sin(v)
let ang = u * 1500
x = x3 * cos(ang) - z3 * sin(ang)
y = y3 * 0.9 + z3 * (0.25 + -0.1439 * cos(3.042 * ang + 0.3242 * t))
z = x3 * sin(ang) + z3 * cos(ang)
h = s
</pre></details></figcaption></figure>

<figure><video src="15.mp4" poster="15.jpg" muted loop playsinline preload="none"></video><figcaption><a href="15.jpg">15</a><details><summary>formula</summary><pre># rose: three hundred petal strands that all cross the centre, so millions
# of points pile onto the same few pixels. the worst case for naive atomics
@points 40m
@palette jade
param k = 1.556
let s = floor(k / (r1 * 3.6)) / 300
let v = fract(u * 300) * tau
let r = cos(k * v + s * 0.9 + t * 0.2) * (0.8 + 0.2 * cos(s * tau * 3 + t * 0.3))

</pre></details></figcaption></figure>

<figure><video src="23.mp4" poster="23.jpg" muted loop playsinline preload="none"></video><figcaption><a href="23.jpg">23</a><details><summary>formula</summary><pre># tiny: the original tiny-code style. ten thousand dots in a browser,
# ten million here. i is the integer index, % folds it into rows
@points 10m

@gamma 2.4

let q = k / 997 * tau
let d = atan2(cos(e * 0.002), sin(q * 2 - (t + -0.2793 * sin(6.717 * r1 + -0.2397 * t)) * 0.2837)) * 0.4564
let a = q + d * sin(e * 0.0005 + t * (floor(u * 300) / 300)) * 2
